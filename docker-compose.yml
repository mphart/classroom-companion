name: classroom-companion

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: companion
      MYSQL_DATABASE: classroom_companion
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcompanion"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - pdf_uploads:/data/uploads/pdfs
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: companion
      DB_NAME: classroom_companion
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      AI_SUMMARIZER: ${AI_SUMMARIZER:-}
      FLASHCARD_GENERATOR: ${FLASHCARD_GENERATOR:-}
      VIDEO: ${VIDEO:-}
      TA_API_KEY: ${TA_API_KEY:-}
      GLOSSARY_API_KEY: ${GLOSSARY_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
      SLIDESHOW_API_KEY: ${SLIDESHOW_API_KEY:-}
      PRACTICE_API_KEY: ${PRACTICE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      GLADIO_API_KEY: ${GLADIO_API_KEY:-}
      PDF_UPLOAD_DIR: /data/uploads/pdfs
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mysql_data:
  pdf_uploads:
